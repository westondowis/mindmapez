<!doctype html>
<html>
  <body style="font: 13px system-ui; width: 300px; padding: 10px">
    <h3 style="margin: 0 0 8px">MindMeld Bridge</h3>
    <label>MindMeld URL<br /><input id="server" style="width: 100%" placeholder="https://your-mindmeld.app" /></label>
    <label>Connector token<br /><input id="token" type="password" style="width: 100%" placeholder="mm_…" /></label>
    <label>Allow site<br /><input id="site" style="width: 100%" placeholder="facebook.com" /></label>
    <p><button id="save">Save</button> <button id="allow">Allow site</button> <button id="poll">Check now</button></p>
    <p id="status" style="color: #666"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
